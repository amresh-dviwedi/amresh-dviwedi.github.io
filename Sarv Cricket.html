<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏏 Sarv Cricket — Live Stats Tracker | Avg, Highest, Ducks</title>
  <meta name="description" content="Track Sarv Cricket player stats live: matches played, runs, average, highest score, and ducks. Real-time sync for all devices. No login required." />
  <link rel="canonical" href="https://sarvcricket.github.io/sarv-cricket-stats/" />
  
  <!-- Open Graph / Social -->
  <meta property="og:title" content="🏏 Sarv Cricket — Live Stats Tracker" />
  <meta property="og:description" content="Track matches, runs, average, highest score & ducks for Sarv Cricket. Live sync across all devices." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://sarvcricket.github.io/sarv-cricket-stats/" />
  <meta name="theme-color" content="#0a2f2a" />
  
  <!-- JSON-LD structured data for Google -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Sarv Cricket Stats Tracker",
      "description": "Live cricket statistics tracker for Sarv Cricket players. Track matches, runs, average, highest score, and ducks in real-time.",
      "applicationCategory": "SportsApplication",
      "browserRequirements": "Requires JavaScript and modern browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & base ── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0a2f2a 0%, #1a4d3e 100%);
      min-height: 100vh;
      padding: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cricket-container {
      max-width: 1440px;
      width: 100%;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 2.5rem;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(120deg, #0b3b2f, #0c2f25);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      border-bottom: 3px solid #f5b042;
    }

    .logo h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo h1 small {
      font-size: 0.9rem;
      font-weight: 400;
      color: #b9dfcf;
      letter-spacing: 0;
    }
    .logo p {
      color: #b9dfcf;
      font-size: 0.75rem;
      margin-top: 2px;
      font-weight: 500;
    }

    .user-panel {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      padding: 0.4rem 1.2rem;
      border-radius: 50px;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .user-status {
      color: #f5e7c6;
      font-weight: 500;
      font-size: 0.8rem;
    }
    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4caf50;
      margin-right: 6px;
      animation: pulse-dot 1.8s infinite;
    }
    @keyframes pulse-dot {
      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.5;
        transform: scale(0.8);
      }
    }

    /* ── Dashboard ── */
    .dashboard {
      padding: 2rem 2rem 1rem;
    }

    .players-section h2,
    .history-section h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
      color: #1e3a2f;
      display: inline-block;
      border-left: 6px solid #f5b042;
      padding-left: 1rem;
    }

    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.8rem;
      margin-bottom: 2.5rem;
    }

    .player-card {
      background: #fff;
      border-radius: 1.8rem;
      padding: 1.5rem 1.5rem 1.2rem;
      box-shadow: 0 15px 30px -12px rgba(0, 0, 0, 0.10);
      transition: all 0.25s ease;
      border: 1px solid rgba(0, 0, 0, 0.04);
      position: relative;
      overflow: hidden;
    }
    .player-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 25px 40px -16px rgba(0, 0, 0, 0.18);
    }
    .player-card .card-accent {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, #f5b042, #e09d2c);
    }

    .player-name {
      font-size: 1.8rem;
      font-weight: 800;
      color: #1f5e48;
      text-align: center;
      padding-bottom: 0.6rem;
      border-bottom: 2px solid #f0b87b;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      background: #f6faf8;
      border-radius: 0.8rem;
      padding: 0.4rem 0.5rem;
      text-align: center;
    }
    .stat-item .stat-label {
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #7a9a8b;
      font-weight: 600;
    }
    .stat-item .stat-value {
      font-size: 1.2rem;
      font-weight: 800;
      color: #1e5a48;
      line-height: 1.3;
    }
    .stat-item .stat-value.duck-warn {
      color: #c0392b;
    }
    .stat-item .stat-value.highlight {
      color: #d4891b;
    }

    .add-score-btn {
      width: 100%;
      margin-top: 0.2rem;
      background: linear-gradient(95deg, #f5b042, #e09d2c);
      border: none;
      padding: 0.7rem;
      font-weight: 700;
      color: #1e3a2f;
      border-radius: 2rem;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
    .add-score-btn:hover {
      background: linear-gradient(95deg, #e09d2c, #cf8a1f);
      transform: scale(0.97);
      color: #fff;
    }

    /* ── History ── */
    .history-panel {
      background: #fbfefc;
      border-radius: 1.8rem;
      padding: 0.4rem 0;
      border: 1px solid #e2ede7;
      max-height: 380px;
      overflow-y: auto;
    }
    .history-panel::-webkit-scrollbar {
      width: 6px;
    }
    .history-panel::-webkit-scrollbar-track {
      background: #eaf0ed;
      border-radius: 10px;
    }
    .history-panel::-webkit-scrollbar-thumb {
      background: #c0d6cc;
      border-radius: 10px;
    }

    .match-history-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding: 0.4rem 0.8rem;
    }

    .history-item {
      background: #fff;
      border-radius: 1.2rem;
      padding: 0.7rem 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      border-left: 6px solid #f5b042;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }
    .history-item .badge {
      background: #2c6e52;
      color: #fff;
      padding: 0.15rem 0.9rem;
      border-radius: 40px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .history-item .detail {
      font-size: 0.9rem;
      color: #2c4a3e;
    }
    .history-item .detail .h-player {
      font-weight: 800;
      color: #cb7b1f;
    }
    .history-item .detail .h-score {
      font-weight: 800;
      color: #1f5e48;
    }
    .history-item .duck-badge {
      background: #c0392b;
      color: #fff;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 0.1rem 0.7rem;
      border-radius: 30px;
      margin-left: 4px;
    }

    .empty-history-placeholder {
      text-align: center;
      padding: 2.5rem;
      color: #95afa3;
      font-style: italic;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background: #eef3f0;
      font-size: 0.7rem;
      color: #528071;
      border-top: 1px solid #d6e4de;
    }

    .hidden {
      display: none !important;
    }

    /* ── Loading overlay ── */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      flex-direction: column;
      gap: 1rem;
    }
    .loading-overlay .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #e2e9e6;
      border-top: 5px solid #f5b042;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
    .loading-overlay .label {
      background: #fff;
      padding: 6px 22px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #1e3a2f;
    }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      body {
        padding: 0.8rem;
      }
      .header {
        padding: 0.8rem 1.2rem;
      }
      .logo h1 {
        font-size: 1.3rem;
      }
      .logo h1 small {
        font-size: 0.7rem;
      }
      .dashboard {
        padding: 1.2rem 1rem;
      }
      .players-grid {
        gap: 1.2rem;
      }
      .player-name {
        font-size: 1.4rem;
      }
      .stats-grid {
        grid-template-columns: 1fr 1fr 1fr;
        gap: 0.3rem;
      }
      .stat-item .stat-value {
        font-size: 1rem;
      }
      .history-item {
        padding: 0.5rem 0.8rem;
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="cricket-container">
    <!-- HEADER -->
    <header class="header">
      <div class="logo">
        <h1>🏏 SARV <small>CRICKET</small></h1>
        <p>matches · runs · avg · highest · ducks · live sync</p>
      </div>
      <div class="user-panel">
        <span class="user-status"><span class="status-dot"></span> Live</span>
      </div>
    </header>

    <!-- MAIN APP -->
    <main id="appMain">
      <div class="dashboard">
        <!-- Players -->
        <section class="players-section">
          <h2>📊 Player Stats</h2>
          <div class="players-grid" id="playersGridContainer">
            <!-- dynamic cards -->
          </div>
        </section>

        <!-- History -->
        <section class="history-section">
          <h2>📜 Match Log</h2>
          <div class="history-panel" id="historyPanel">
            <div id="emptyHistoryMsg" class="empty-history-placeholder">✨ No scores yet. Add a match to begin.</div>
            <div id="matchHistoryList" class="match-history-list"></div>
          </div>
        </section>
      </div>
      <footer>
        🔄 Real-time Firebase sync — every score appears instantly on all devices.
        &bull; <strong>Matches</strong> = innings played &bull; <strong>Duck</strong> = 0 runs in an innings
      </footer>
    </main>
  </div>

  <!-- Loading overlay -->
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="spinner"></div>
    <div class="label">Syncing with Firebase…</div>
  </div>

  <script type="module">
    // ──────────────────────────────────────────────
    //  Firebase imports & config
    // ──────────────────────────────────────────────
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      query,
      orderBy,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDVADShdTKth5DLcqliIesrxUM2rJFWJ0Y",
      authDomain: "cricket-1fe27.firebaseapp.com",
      projectId: "cricket-1fe27",
      storageBucket: "cricket-1fe27.firebasestorage.app",
      messagingSenderId: "899030654947",
      appId: "1:899030654947:web:090614305cdb8ecfe4cad6",
      measurementId: "G-KPP4EQ5YCY"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ──────────────────────────────────────────────
    //  Player config
    // ──────────────────────────────────────────────
    const PLAYERS = [
      { id: "player1", displayName: "Player 1", emoji: "🏏" },
      { id: "player2", displayName: "Player 2", emoji: "⚡" },
      { id: "player3", displayName: "Player 3", emoji: "🎯" }
    ];

    // In-memory store
    let allEntries = [];

    // DOM refs
    const grid = document.getElementById("playersGridContainer");
    const historyList = document.getElementById("matchHistoryList");
    const emptyMsg = document.getElementById("emptyHistoryMsg");
    const loadingOverlay = document.getElementById("loadingOverlay");

    // ──────────────────────────────────────────────
    //  Helpers
    // ──────────────────────────────────────────────
    function setLoading(show) {
      loadingOverlay.classList.toggle("hidden", !show);
    }

    function formatTime(timestamp) {
      if (!timestamp) return "just now";
      try {
        const d = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      } catch { return "recent"; }
    }

    function getPlayerName(id) {
      const p = PLAYERS.find(x => x.id === id);
      return p ? p.displayName : id;
    }

    function getPlayerEmoji(id) {
      const p = PLAYERS.find(x => x.id === id);
      return p ? p.emoji : '🏏';
    }

    // ──────────────────────────────────────────────
    //  Stats calculation
    // ──────────────────────────────────────────────
    function computeStats(entries, playerId) {
      const playerEntries = entries.filter(e => e.player === playerId);
      const scores = playerEntries.map(e => Number(e.score) || 0);
      const matches = scores.length;
      const totalRuns = scores.reduce((a, b) => a + b, 0);
      const avg = matches > 0 ? (totalRuns / matches) : 0;
      const highest = matches > 0 ? Math.max(...scores) : 0;
      const ducks = scores.filter(s => s === 0).length;
      return { matches, totalRuns, avg, highest, ducks };
    }

    // ──────────────────────────────────────────────
    //  Render UI
    // ──────────────────────────────────────────────
    function renderCards() {
      grid.innerHTML = '';
      PLAYERS.forEach(p => {
        const stats = computeStats(allEntries, p.id);
        const card = document.createElement('div');
        card.className = 'player-card';
        card.innerHTML = `
            <div class="card-accent"></div>
            <div class="player-name">${p.emoji} ${p.displayName}</div>
            <div class="stats-grid">
              <div class="stat-item">
                <span class="stat-label">🏏 Runs</span>
                <span class="stat-value">${stats.totalRuns}</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">📊 Avg</span>
                <span class="stat-value">${stats.avg.toFixed(1)}</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">🏆 Highest</span>
                <span class="stat-value highlight">${stats.highest}</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">🦆 Ducks</span>
                <span class="stat-value ${stats.ducks > 0 ? 'duck-warn' : ''}">${stats.ducks}</span>
              </div>
              <div class="stat-item">
                <span class="stat-label">📋 Matches</span>
                <span class="stat-value">${stats.matches}</span>
              </div>
              <div class="stat-item" style="background:transparent; box-shadow:none;">
                <!-- spacer -->
              </div>
            </div>
            <button class="add-score-btn" data-player="${p.id}">➕ Add Score</button>
          `;
        grid.appendChild(card);
      });

      document.querySelectorAll('.add-score-btn').forEach(btn => {
        btn.removeEventListener('click', handleAddScore);
        btn.addEventListener('click', handleAddScore);
      });
    }

    function renderHistory() {
      if (!allEntries.length) {
        emptyMsg.classList.remove('hidden');
        historyList.innerHTML = '';
        return;
      }
      emptyMsg.classList.add('hidden');

      const sorted = [...allEntries].sort((a, b) => {
        const ta = a.timestamp?.toDate?.() || new Date(a.createdAt || 0);
        const tb = b.timestamp?.toDate?.() || new Date(b.createdAt || 0);
        return tb - ta;
      });

      historyList.innerHTML = sorted.map(entry => {
        const score = Number(entry.score) || 0;
        const isDuck = score === 0;
        const name = getPlayerName(entry.player);
        const emoji = getPlayerEmoji(entry.player);
        const time = formatTime(entry.timestamp || entry.createdAt);
        return `
              <div class="history-item">
                <span class="badge">${time}</span>
                <span class="detail">
                  <span class="h-player">${emoji} ${name}</span> scored
                  <span class="h-score">${score} runs</span>
                  ${isDuck ? '<span class="duck-badge">🦆 DUCK</span>' : ''}
                </span>
              </div>
            `;
      }).join('');
    }

    // ──────────────────────────────────────────────
    //  Add score
    // ──────────────────────────────────────────────
    async function handleAddScore(e) {
      const btn = e.currentTarget;
      const playerId = btn.dataset.player;
      if (!playerId) return;

      const name = getPlayerName(playerId);
      const input = prompt(`🎯 Enter runs for ${name}:`, '12');
      if (input === null) return;

      const score = parseInt(input, 10);
      if (isNaN(score) || score < 0) {
        alert('Please enter a valid non-negative number.');
        return;
      }
      if (score > 500 && !confirm(`Score ${score} is very high. Still add?`)) return;

      setLoading(true);
      try {
        await addDoc(collection(db, 'cricketScores'), {
          player: playerId,
          score: score,
          createdAt: serverTimestamp(),
          timestamp: serverTimestamp()
        });
      } catch (err) {
        console.error(err);
        alert('Failed to save score. Check network/Firebase rules.');
      } finally {
        setLoading(false);
      }
    }

    // ──────────────────────────────────────────────
    //  Firestore listener
    // ──────────────────────────────────────────────
    function subscribe() {
      const q = query(collection(db, 'cricketScores'), orderBy('createdAt', 'desc'));
      onSnapshot(q,
        (snap) => {
          const entries = [];
          snap.forEach(doc => {
            const data = doc.data();
            entries.push({
              id: doc.id,
              player: data.player,
              score: data.score,
              timestamp: data.timestamp || data.createdAt,
              createdAt: data.createdAt
            });
          });
          allEntries = entries;
          renderCards();
          renderHistory();
        },
        (err) => {
          console.error('Firestore listener error:', err);
          alert('⚠️ Unable to connect to Firestore. Check your Firebase rules and network.');
        }
      );
    }

    // ──────────────────────────────────────────────
    //  Init
    // ──────────────────────────────────────────────
    function init() {
      renderCards();
      renderHistory();
      subscribe();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    // Expose for debugging
    window.__sarvDebug = { allEntries, PLAYERS };
  </script>
</body>
</html>
